# Weekly update proposals (pull requests) for npm packages and GitHub Actions.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # Node.js types follow the Node version built into Electron (updated together).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      # One PR for the build/test tooling, one per runtime-relevant package.
      tooling:
        patterns: ['@types/*', 'electron-vite', 'vite', 'vitest', 'typescript', 'playwright', 'oxlint', 'prettier']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
