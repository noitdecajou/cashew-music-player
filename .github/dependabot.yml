# Monthly update proposals (pull requests) for npm packages and GitHub Actions.
# Security fixes do not wait for this schedule: "Dependabot security updates"
# (Settings > Code security) proposes them as soon as an advisory is published.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      # Node.js types follow the Node version built into Electron (updated together).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      # One PR for the build/test tooling; Electron and the runtime packages get their own.
      tooling:
        patterns: ['@types/*', 'electron-vite', 'vite', 'vitest', 'typescript', 'playwright', 'oxlint', 'prettier']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      # One PR for every workflow action.
      actions:
        patterns: ['*']
