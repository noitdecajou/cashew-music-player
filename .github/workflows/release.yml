name: Release

# Publishes the Windows installer as a GitHub Release; installed apps then
# offer the update. Two ways:
# - push a tag such as v2.0.0 (must match package.json);
# - Actions > Release > Run workflow with "Publish" ticked: the tag
#   v<package.json version> is created on the selected commit.
# "Run workflow" without "Publish" only builds (installer in the run's artifacts).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publier la version de package.json (crée l’étiquette v<version>)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      # Signed by SignPath Foundation once configured (docs/signing.md), and only
      # for builds that are published.
      SIGN: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && (startsWith(github.ref, 'refs/tags/') || inputs.publish == true) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # to check that a published commit is on main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tag must match package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then echo "Tag $GITHUB_REF_NAME != $version"; exit 1; fi
      - name: Only commits of main are published
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        shell: bash
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Seuls les commits de main peuvent être publiés (lance le workflow depuis main)."; exit 1
          fi
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx electron-vite build
      # Signed releases name their publisher in app-update.yml: installed apps then
      # refuse an update that is not signed by it (electron-updater checks Authenticode).
      - name: Build installer
        shell: bash
        env:
          PUBLISHER: ${{ vars.SIGNPATH_PUBLISHER_NAME }}
        run: |
          if [ "$SIGN" = "true" ]; then
            if [ -z "$PUBLISHER" ]; then echo "Signature active : définis la variable SIGNPATH_PUBLISHER_NAME (docs/signing.md)."; exit 1; fi
            npx electron-builder --win --publish never "-c.win.signtoolOptions.publisherName=$PUBLISHER"
          else
            npx electron-builder --win --publish never
          fi
      - name: Check the packaged files against their integrity manifest
        env:
          MP_PACKAGE_DIR: dist/win-unpacked
        run: npx vitest run test/unit/package.test.ts
      # --- Code signing (SignPath) ------------------------------------------
      # 1. the app (Music Player.exe), 2. the installer built from the signed
      # app, 3. the update metadata recomputed for the signed installer.
      - name: 'Signing: upload the app'
        if: env.SIGN == 'true'
        id: unsigned-app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-app
          path: dist/win-unpacked
          if-no-files-found: error
      - name: 'Signing: sign the app'
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/signed-app
      - name: 'Signing: build the installer from the signed app'
        if: env.SIGN == 'true'
        shell: bash
        run: |
          rm -f dist/*.exe dist/*.blockmap dist/latest.yml
          npx electron-builder --win nsis --prepackaged dist/signed-app --publish never -c.win.signAndEditExecutable=false
      - name: 'Signing: upload the installer'
        if: env.SIGN == 'true'
        id: unsigned-installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-installer
          path: dist/*.exe
          if-no-files-found: error
      - name: 'Signing: sign the installer'
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/signed-installer
      - name: 'Signing: update the metadata of the signed installer'
        if: env.SIGN == 'true'
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          cp "dist/signed-installer/MusicPlayer-Setup-$version.exe" "dist/MusicPlayer-Setup-$version.exe"
          node build/update-metadata.cjs "dist/MusicPlayer-Setup-$version.exe" dist/latest.yml
      # One release, created in a single step with every file (electron-builder's
      # own publishing raced and created duplicate releases). Versions with a
      # suffix (-beta.N) are prereleases: stable installs never get them.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" != "tag" ] && git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "La version $version est déjà publiée : change la version dans package.json."; exit 1
          fi
          awk -v v="$version" '$0 == "## " v {found=1; next} /^## / && found {exit} found' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Music Player $version" > notes.md
          prerelease=""; [[ "$version" == *-* ]] && prerelease="--prerelease"
          target=""; [ "$GITHUB_REF_TYPE" = "tag" ] && target="--verify-tag" || target="--target $GITHUB_SHA"
          gh release create "$tag" $target --title "Music Player $version" --notes-file notes.md $prerelease \
            "dist/MusicPlayer-Setup-$version.exe" "dist/MusicPlayer-Setup-$version.exe.blockmap" dist/latest.yml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MusicPlayer-Setup
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error
