appId: local.musicplayer.desktop
productName: Music Player
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - resources/**
  - package.json
win:
  target: nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Music Player
  artifactName: MusicPlayer-Setup-${version}.exe
portable:
  artifactName: MusicPlayer-Portable-${version}.exe
