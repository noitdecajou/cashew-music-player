<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Music Player</title>
  <link rel="stylesheet" href="./styles/base.css">
  <link rel="stylesheet" href="./styles/mini-modern.css">
  <link rel="stylesheet" href="./styles/mini-skins.css">
</head>
<body class="booting" data-theme="modern">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12 18 6v12z"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M14 4h6v6l-2.2-2.2-3.9 3.9-1.4-1.4 3.9-3.9zM4 6.4 5.4 5l13.2 13.2V14h1.4v6h-6v-1.4h4.2zM10 14.6l1.4 1.4L5.4 22 4 20.6z" transform="translate(0 -1)"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke="currentColor" stroke-width="2"/><path d="m15 15 5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M9 3h6l-1 6 3 3v2h-4v6l-1 1-1-1v-6H7v-2l3-3z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="i-pin-on" viewBox="0 0 24 24"><path d="M9 3h6l-1 6 3 3v2h-4v6l-1 1-1-1v-6H7v-2l3-3z" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="i-expand" viewBox="0 0 24 24"><path d="M13 5h6v6M19 5l-7 7M11 19H5v-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-compact" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="11" y="12" width="7" height="5" rx="1"/></symbol>
    <symbol id="i-bar" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M4 9h16" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="m16 9.5 5 5m0-5-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-grip" viewBox="0 0 24 24"><g><circle cx="9" cy="6" r="1.4"/><circle cx="15" cy="6" r="1.4"/><circle cx="9" cy="12" r="1.4"/><circle cx="15" cy="12" r="1.4"/><circle cx="9" cy="18" r="1.4"/><circle cx="15" cy="18" r="1.4"/></g></symbol>
    <symbol id="i-vol-1" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9.5a3.5 3.5 0 0 1 0 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-vol-3" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9.5a3.5 3.5 0 0 1 0 5M18.5 7a7 7 0 0 1 0 10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  </svg>

  <div id="titlebar" role="toolbar" aria-label="Fenêtre">
    <span class="brand"><img src="./icon.png" alt="">Music Player</span>
    <button data-window="minimize" title="Réduire" aria-label="Réduire"><svg viewBox="0 0 16 16"><path d="M3 8h10"/></svg></button>
    <button data-window="maximize" class="large-only" title="Agrandir" aria-label="Agrandir"><svg viewBox="0 0 16 16"><rect x="3.5" y="3.5" width="9" height="9"/></svg></button>
    <button data-window="close" class="close" title="Masquer (la musique continue)" aria-label="Masquer dans la zone de notification"><svg viewBox="0 0 16 16"><path d="m4 4 8 8m0-8-8 8"/></svg></button>
  </div>

  <header id="toolbar" class="large-only">
    <div class="now"><img class="cover" alt=""><div class="meta"><div class="title truncate"></div><div class="artist truncate"></div></div></div>
    <span class="notice" role="status"></span>
    <button data-window="toggle-search" aria-label="Rechercher" title="Rechercher (Ctrl+K)"><svg><use href="#i-search"/></svg></button>
    <button data-window="toggle-queue" title="File d’attente">File</button>
    <button data-window="toggle-settings" title="Réglages">Réglages</button>
    <button data-window="pin" class="pin" aria-label="Épingler au premier plan"><svg><use href="#i-pin"/></svg></button>
    <button data-window="toggle-mini" class="primary" title="Passer en mini-player">Mini-player <svg><use href="#i-compact"/></svg></button>
  </header>

  <main id="mini" class="mini-only" aria-label="Mini-player">
    <div class="card">
      <div class="face" aria-hidden="true"></div>
      <div class="screen" aria-hidden="true"></div>
      <span class="brand-label drag-zone" aria-hidden="true"><i class="led"></i>MUSIC PLAYER</span>
      <img class="cover drag-zone" alt="">
      <div class="meta drag-zone"><div class="title truncate"></div><div class="artist truncate"></div></div>
      <div class="tools">
        <button data-window="toggle-title-bar" class="titlebar-toggle" aria-label="Masquer la barre de fenêtre" title="Masquer la barre de fenêtre (Ctrl+Maj+B)"><svg><use href="#i-bar"/></svg></button>
        <button data-window="toggle-search" aria-label="Rechercher" title="Rechercher (Ctrl+K)"><svg><use href="#i-search"/></svg></button>
        <button data-window="pin" class="pin" aria-label="Épingler au premier plan"><svg><use href="#i-pin"/></svg></button>
        <button data-window="toggle-mini" aria-label="Agrandir le lecteur" title="Agrandir le lecteur"><svg><use href="#i-expand"/></svg></button>
      </div>
      <div class="progress-row">
        <span class="time elapsed">0:00</span>
        <div class="slider progress" role="slider" tabindex="0" aria-label="Position de lecture" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="rail"><div class="fill"></div></div><div class="thumb"></div>
        </div>
        <span class="time total">—</span>
      </div>
      <div class="bottom">
        <div class="controls">
          <button data-command="shuffle" class="shuffle" aria-label="Aléatoire"><svg><use href="#i-shuffle"/></svg></button>
          <button data-command="previous" aria-label="Précédent" title="Précédent"><svg><use href="#i-prev"/></svg></button>
          <button data-command="toggle-play" class="play" aria-label="Lire"><svg><use href="#i-play"/></svg></button>
          <button data-command="next" aria-label="Suivant" title="Suivant"><svg><use href="#i-next"/></svg></button>
        </div>
        <button class="volume-button" aria-expanded="false" aria-label="Volume" title="Volume — molette pour régler"><svg><use href="#i-vol-3"/></svg></button>
        <div class="slot">
          <button class="upnext" data-window="toggle-queue" title="Afficher la file"><span class="label">À SUIVRE</span><span class="next-title truncate"></span><span class="next-artist truncate"></span></button>
          <div class="volume-panel">
            <div class="slider volume" role="slider" tabindex="0" aria-label="Volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
              <div class="rail"><div class="fill"></div></div><div class="thumb"></div>
            </div>
            <span class="volume-value">100</span>
            <button class="volume-mute" aria-pressed="false" aria-label="Couper le son" title="Couper le son"><svg><use href="#i-mute"/></svg></button>
          </div>
        </div>
        <button class="grip" aria-label="Déplacer le lecteur" title="Déplacer : glisser, ou flèches du clavier"><svg><use href="#i-grip"/></svg></button>
      </div>
    </div>
  </main>

  <aside id="panel" hidden>
    <div class="panel-head"><strong class="panel-title"></strong><button data-window="close-panel" class="icon" aria-label="Fermer le panneau" title="Fermer (Échap)">✕</button></div>
    <div class="panel-notice" role="status" hidden></div>

    <section data-panel="search" hidden>
      <div class="search-box"><input id="query" type="search" placeholder="Rechercher…" aria-label="Rechercher" autocomplete="off" spellcheck="false"></div>
      <div class="tabs" role="tablist">
        <button role="tab" data-scope="library" aria-selected="true">Mes playlists</button>
        <button role="tab" data-scope="playlists" aria-selected="false">Playlists</button>
        <button role="tab" data-scope="web" aria-selected="false">YouTube Music</button>
      </div>
      <div class="status-line"><span class="library-status"></span><button class="link refresh-library" title="Réindexer mes playlists">Actualiser</button></div>
      <ol class="results" aria-label="Résultats"></ol>
    </section>

    <section data-panel="queue" hidden>
      <div class="status-line"><span class="queue-status"></span></div>
      <ol class="results queue-list" aria-label="File d’attente"></ol>
    </section>

    <section data-panel="settings" hidden>
      <h3>Apparence du mini-player</h3>
      <div class="theme-grid" role="radiogroup" aria-label="Apparence"></div>
      <label class="check"><input type="checkbox" id="seamless"> Masquer la barre de fenêtre du mini-player <kbd>Ctrl+Maj+B</kbd></label>
      <h3>Démarrage</h3>
      <label class="check"><input type="checkbox" id="startup"> Lancer avec Windows</label>
      <label class="check"><input type="checkbox" id="quietStartup"> Démarrer discrètement (dans la zone de notification)</label>
      <h3>Raccourci global</h3>
      <p class="hint">Affiche ou masque le mini-player depuis n’importe quelle application.</p>
      <div class="shortcut-row"><input id="shortcut" readonly aria-label="Raccourci global" placeholder="Aucun"><button id="resetShortcut">Par défaut</button><button id="clearShortcut">Désactiver</button></div>
      <p class="hint shortcut-status"></p>
      <h3>Mises à jour</h3>
      <div class="update-row"><span class="update-status hint"></span><button id="updateAction" hidden></button></div>
      <div class="update-progress" hidden><div class="fill"></div></div>
      <h3>YouTube Music</h3>
      <div class="buttons"><button data-window="reload-music">Recharger YouTube Music</button><button id="diagnostics">Mesurer la consommation</button></div>
      <p class="hint diagnostics-result"></p>
      <p class="hint version"></p>
    </section>
  </aside>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
